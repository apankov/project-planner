[project]
site_name = "Project Planner"
site_url = "https://hmil1151.github.io/project-planner/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/usage.md",
    "getting-started/task-editor.md",
    "getting-started/unlinked-tasks-panel.md",
    "getting-started/gantt.md",
    "getting-started/board.md",
    "getting-started/finance.md",
    "getting-started/embedding.md",
    "getting-started/settings.md",
  ] },
  { "Contributing" = [
    "contributing/index.md",
    "contributing/development.md",
    "contributing/ci-releases.md",
    "contributing/opencode.md",
    "contributing/documentation.md",
  ] },
  { "License" = "license.md" },
]

[project.theme]
features = ["navigation.indexes"]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
